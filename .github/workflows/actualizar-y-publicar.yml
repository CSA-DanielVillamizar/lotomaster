name: Actualizar resultados y publicar

on:
  # Los sorteos son lunes, miércoles y sábado a las 11:00 p. m. (hora Colombia = UTC-5),
  # es decir martes, jueves y domingo a las 04:00 UTC. Se intenta ~1 h y ~4 h después.
  schedule:
    - cron: "7 5 * * 2,4,0"
    - cron: "37 7 * * 2,4,0"
    # Refresco diario del acumulado anunciado.
    - cron: "17 14 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[datos]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar últimos sorteos
        if: github.event_name != 'push'
        run: python scripts/update.py

      - name: Guardar datos nuevos
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "lotomaster-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Actualizar resultados [datos]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
